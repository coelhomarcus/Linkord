name: CI

# Runs lint, tests, a real Postgres migration smoke test, and the production
# build on every push/PR. Unit tests still isolate their DB-dependent code;
# the migration step is the integration check that exercises Postgres.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/linkord_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linkord_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (web)
        run: npm ci --prefix web

      - name: Lint frontend
        run: npm run lint --prefix web

      - name: Verify migrations against Postgres
        run: npm run db:migrate

      - name: Run server tests
        run: npm run test:server

      - name: Run frontend tests
        run: npm run test:web

      - name: Build (ensures everything still compiles)
        run: npm run build

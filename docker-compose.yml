# No reverse proxy/SSL here — in production this runs behind Dokploy, which
# already has its own Traefik + automatic certificates.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    mem_reservation: 512m

# No reverse proxy/SSL here — in production this runs behind Dokploy, which
# already has its own Traefik + automatic certificates.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkord
      POSTGRES_PASSWORD: linkord
      POSTGRES_DB: linkord
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkord -d linkord"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose ships its own private Postgres. Dokploy/standalone Docker
      # deployments still use DATABASE_URL from their normal environment.
      DATABASE_URL: postgres://linkord:linkord@postgres:5432/linkord
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_reservation: 512m
    stop_grace_period: 10s

volumes:
  postgres-data:

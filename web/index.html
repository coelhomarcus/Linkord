<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Linkord</title>
    <meta name="description" content="Linkord: compartilhamento de tela e chat em tempo real, sem cadastro e sem link." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#131519" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- favicon.svg adapts to light/dark automatically via its own embedded
         prefers-color-scheme media query (see web/public/favicon.svg) — the
         `media` attribute on this link isn't reliably honored by browsers,
         so there's no need for a second <link> here. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>html,body{background:#131519}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
